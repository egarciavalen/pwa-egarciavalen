<div class="container">
  <div class="headerContainer">
    <h2>DRAGON BALL PWA</h2>
    <div>
      <button
        [ngClass]="{ isSelected: isCardView() }"
        matIconButton
        aria-label="Vista del contenido usando tarjetas"
        (click)="showCardView()"
      >
        <mat-icon>apps</mat-icon>
      </button>
      <button
        [ngClass]="{ isSelected: !isCardView() }"
        matIconButton
        aria-label="Vista del contenido usando una tabla"
        (click)="showTableView()"
      >
        <mat-icon>list</mat-icon>
      </button>
    </div>
  </div>

  @if (isCardView()) {
    <!-- Formato con las cards -->
      <app-card [characters]="characters()"></app-card>
  } @else {
    <!-- Formato con la tabla -->
    <app-grid [characters]="characters()"></app-grid>
  }
</div>

<!-- Spinner -->
<app-spinner [isLoading]="isLoading()"></app-spinner>
